<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d10" />
      <stop offset="100%" stop-color="#040506" />
    </linearGradient>

    <!-- Green Emerald Metallic Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Emerald Inner Glow -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="6" />

  <!-- Shield Shape Outer Border -->
  <path d="M 256,76 C 340,76 400,104 400,104 C 400,248 356,364 256,436 C 156,364 112,248 112,104 C 112,104 172,76 256,76 Z" 
        fill="none" 
        stroke="url(#greenGrad)" 
        stroke-width="22" 
        stroke-linejoin="round" 
        filter="url(#emeraldGlow)" />

  <!-- Shield Inner Fill Tint -->
  <path d="M 256,92 C 328,92 380,116 380,116 C 380,240 340,344 256,412 C 172,344 132,240 132,116 C 132,116 184,92 256,92 Z" 
        fill="#10b981" 
        fill-opacity="0.08" />

  <!-- Radar Concentric Waves -->
  <circle cx="256" cy="240" r="100" fill="none" stroke="#10b981" stroke-width="8" stroke-opacity="0.3" stroke-dasharray="8 6" />
  <circle cx="256" cy="240" r="68" fill="none" stroke="#10b981" stroke-width="10" stroke-opacity="0.5" />

  <!-- Central Location Pin -->
  <path d="M 256,164 C 220,164 192,192 192,228 C 192,276 256,348 256,348 C 256,348 320,276 320,228 C 320,192 292,164 256,164 Z" 
        fill="url(#greenGrad)" />

  <!-- Inner Pin Eye Dot -->
  <circle cx="256" cy="224" r="22" fill="#040506" />
  <circle cx="256" cy="224" r="10" fill="#10b981" />
</svg>
