<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="alternate icon" type="image/png" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="canonical" href="https://sentinel-app.it/" />
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
    
    <!-- SEO Meta Tags -->
    <title>Sentinel — Sicurezza urbana in tempo reale, verificata</title>
    <meta name="description" content="Scopri cosa succede davvero nella tua città con dati ufficiali e segnalazioni verificate. Senza allarmismo, prima che tu debba chiederlo." />
    <meta name="keywords" content="sicurezza urbana Italia, allerte in tempo reale, app sicurezza cittadini, mappa emergenze Italia" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sentinel-app.it/" />
    <meta property="og:title" content="Sentinel — Sicurezza urbana in tempo reale, verificata" />
    <meta property="og:description" content="Scopri cosa succede davvero nella tua città con dati ufficiali e segnalazioni verificate. Senza allarmismo, prima che tu debba chiederlo." />
    <meta property="og:image" content="https://sentinel-app.it/sentinel_hero_map.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://sentinel-app.it/" />
    <meta name="twitter:title" content="Sentinel — Sicurezza urbana in tempo reale, verificata" />
    <meta name="twitter:description" content="Scopri cosa succede davvero nella tua città con dati ufficiali e segnalazioni verificate. Senza allarmismo, prima che tu debba chiederlo." />
    <meta name="twitter:image" content="https://sentinel-app.it/sentinel_hero_map.png" />

    <!-- Structured Data (JSON-LD) - Ethical & No Fake Rating -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Sentinel",
      "applicationCategory": "SafetyApplication",
      "operatingSystem": "iOS, Android, Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "EUR"
      },
      "description": "Piattaforma di sicurezza urbana partecipata e tracciamento emergenze in tempo reale con moderazione preventiva e fonti verificate."
    }
    </script>
  </head>
  <body class="bg-[#050505] text-white">
    <div id="root">
      <div style="min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#050505; color:white; font-family:sans-serif; text-align:center; padding:20px;">
        <div style="position:relative; margin-bottom:20px;">
          <img src="/logo.svg" alt="Sentinel Logo" style="width:64px; height:64px; border-radius:16px; object-fit:cover;" />
          <div style="position:absolute; inset:-4px; border-radius:20px; border:2px solid #10b981; opacity:0.6; animation:pulse 2s infinite;"></div>
        </div>
        <h1 style="font-size:20px; font-weight:800; margin:0 0 6px 0; letter-spacing: -0.02em;">Sentinel</h1>
        <p style="font-size:12px; color:rgba(255,255,255,0.5); margin:0;">Inizializzazione network di sicurezza...</p>
        <style>
          @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.4; } 50% { transform: scale(1.08); opacity: 0.8; } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
